name: Build Android APK with GStreamer

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build GStreamer Android APK
    runs-on: ubuntu-latest

    env:
      GST_VERSION: "1.24.12"
      NDK_VERSION: "26.3.11579264"
      GST_SDK_DIR: "/home/runner/gstreamer-android"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android NDK and CMake
        run: |
          echo "Accepting Android SDK licenses..."
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          echo "Installing NDK ${{ env.NDK_VERSION }} and CMake 3.22.1..."
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;${{ env.NDK_VERSION }}" "cmake;3.22.1"

      - name: Cache GStreamer Android SDK
        id: cache-gstreamer
        uses: actions/cache@v4
        with:
          path: ${{ env.GST_SDK_DIR }}
          key: gstreamer-android-${{ env.GST_VERSION }}-universal

      - name: Download and unpack GStreamer Android SDK
        if: steps.cache-gstreamer.outputs.cache-hit != 'true'
        run: |
          mkdir -p ${{ env.GST_SDK_DIR }}
          echo "Downloading GStreamer ${{ env.GST_VERSION }} Android universal SDK..."
          curl -fL --retry 3 --connect-timeout 30 -o /tmp/gstreamer-android.tar.xz \
            https://gstreamer.freedesktop.org/data/pkg/android/${{ env.GST_VERSION }}/gstreamer-1.0-android-universal-${{ env.GST_VERSION }}.tar.xz
          echo "Unpacking GStreamer SDK..."
          tar -xf /tmp/gstreamer-android.tar.xz -C ${{ env.GST_SDK_DIR }}
          rm -f /tmp/gstreamer-android.tar.xz

      - name: Grant execute permission for Gradle wrapper
        run: |
          chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          export GSTREAMER_ROOT_ANDROID="${{ env.GST_SDK_DIR }}"
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/${{ env.NDK_VERSION }}"
          ./gradlew assembleDebug --stacktrace -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gst-launcher-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
