# GitHub Actions Workflow Configuration
# Also mirrored to .github/workflows/build.yaml

name: Build Android APK with GStreamer

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build GStreamer Android APK
    runs-on: ubuntu-latest

    env:
      GST_VERSION: "1.24.12"
      NDK_VERSION: "26.3.11579264"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK and NDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK and CMake
        run: |
          sdkmanager --install "ndk;${{ env.NDK_VERSION }}" "cmake;3.22.1"

      - name: Cache GStreamer Android SDK
        id: cache-gstreamer
        uses: actions/cache@v4
        with:
          path: /opt/gstreamer-android
          key: gstreamer-android-${{ env.GST_VERSION }}-universal

      - name: Download and unpack GStreamer Android SDK
        if: steps.cache-gstreamer.outputs.cache-hit != 'true'
        run: |
          mkdir -p /opt/gstreamer-android
          echo "Downloading GStreamer ${{ env.GST_VERSION }} Android universal SDK..."
          curl -L -o /tmp/gstreamer-android.tar.xz \
            https://gstreamer.freedesktop.org/data/pkg/android/${{ env.GST_VERSION }}/gstreamer-1.0-android-universal-${{ env.GST_VERSION }}.tar.xz
          tar -xf /tmp/gstreamer-android.tar.xz -C /opt/gstreamer-android
          rm /tmp/gstreamer-android.tar.xz

      - name: Grant execute permission for Gradle wrapper
        run: |
          cd android
          chmod +x gradlew || true

      - name: Build Debug APK
        env:
          GSTREAMER_ROOT_ANDROID: /opt/gstreamer-android
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}
        run: |
          cd android
          if [ ! -f gradlew ]; then
            gradle wrapper
          fi
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gst-launcher-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
